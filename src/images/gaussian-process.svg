<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="350" height="350" viewBox="0 0 282 282">
  <style>
    .line { stroke:#1f618d; stroke-width:2; fill:none }
    .label { font-family:'Comic Sans MS', cursive; font-weight:700; font-size:12 }
    .muted { font-family:'Comic Sans MS', cursive; font-size:11; fill:#333 }
    .box { fill:#fff; stroke:#222; stroke-width:2; rx:8; ry:8 }
  </style>
  <rect width="282" height="282" fill="#fff"/>

  <!-- simple mean and sample functions -->
  <path class="line" d="M20 180 C60 80 120 80 160 140 C200 200 240 140 260 120" />
  <path class="line" d="M20 200 C60 120 120 120 160 150 C200 180 240 160 260 140" stroke-dasharray="4 3"/>

  <g transform="translate(20,20)">
    <rect class="box" width="242" height="56" />
    <text x="121" y="36" text-anchor="middle" class="label">Function prior via covariance/kernel</text>
  </g>

  <text x="141" y="250" class="muted" text-anchor="middle">Samples from a Gaussian process prior / posterior</text>
</svg>
