<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="350" height="350" viewBox="0 0 282 282">
  <style>
    .dot { fill:#1f618d }
    .line { stroke:#1f618d; stroke-width:2 }
    .label { font-family:'Comic Sans MS', cursive; font-weight:700; font-size:12 }
    .muted { font-family:'Comic Sans MS', cursive; font-size:11; fill:#333 }
  </style>
  <rect width="282" height="282" fill="#fff"/>

  <!-- points -->
  <circle class="dot" cx="50" cy="200" r="4"/>
  <circle class="dot" cx="90" cy="160" r="4"/>
  <circle class="dot" cx="140" cy="120" r="4"/>
  <circle class="dot" cx="190" cy="90" r="4"/>
  <circle class="dot" cx="230" cy="70" r="4"/>

  <!-- fitted line -->
  <line class="line" x1="30" y1="220" x2="250" y2="60" />

  <text x="141" y="250" class="muted" text-anchor="middle">Fit</text>
</svg>
