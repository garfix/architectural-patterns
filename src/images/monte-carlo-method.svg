<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="350" height="350" viewBox="0 0 282 282">
  <style>
    .dot { fill:#1f618d }
    .label { font-family:'Comic Sans MS', cursive; font-weight:700; font-size:12 }
    .muted { font-family:'Comic Sans MS', cursive; font-size:11; fill:#333 }
    .box { fill:#fff; stroke:#222; stroke-width:2; rx:8; ry:8 }
  </style>
  <rect width="282" height="282" fill="#fff"/>

  <!-- random samples scattered -->
  <g>
    <circle class="dot" cx="50" cy="70" r="4"/>
    <circle class="dot" cx="80" cy="120" r="4"/>
    <circle class="dot" cx="120" cy="90" r="4"/>
    <circle class="dot" cx="160" cy="140" r="4"/>
    <circle class="dot" cx="200" cy="100" r="4"/>
    <circle class="dot" cx="230" cy="150" r="4"/>
  </g>

  <g transform="translate(30,170)">
    <rect class="box" width="220" height="70" />
    <text x="110" y="36" text-anchor="middle" class="label">Estimate statistic by sampling</text>
  </g>

  <text x="141" y="160" class="muted" text-anchor="middle">Random samples approximate integrals / distributions</text>
</svg>
