<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="350" height="350" viewBox="0 0 282 282">
  <style>
    .box { fill:#fff; stroke:#222; stroke-width:2; rx:8; ry:8 }
    .dot { fill:#1f618d }
    .label { font-family:'Comic Sans MS', cursive; font-weight:700; font-size:12 }
    .muted { font-family:'Comic Sans MS', cursive; font-size:11; fill:#333 }
    .arrow { stroke:#000; stroke-width:2.5; fill:none; marker-end:url(#arrowSmall) }
  </style>
  <defs>
    <marker id="arrowSmall" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><polygon points="0 0,6 3,0 6" fill="#000"/></marker>
  </defs>
  <rect width="282" height="282" fill="#fff"/>

  <!-- path of sampler -->
  <path class="arrow" d="M40 60 Q80 100 120 80 Q160 60 200 110 Q220 140 240 120" />
  <circle class="dot" cx="40" cy="60" r="4"/>
  <circle class="dot" cx="120" cy="80" r="4"/>
  <circle class="dot" cx="200" cy="110" r="4"/>

  <g transform="translate(30,190)">
    <rect class="box" width="220" height="60" />
    <text x="110" y="36" text-anchor="middle" class="label">Samples collected along a Markov chain</text>
  </g>
</svg>
