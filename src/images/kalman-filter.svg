<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="350" height="350" viewBox="0 0 282 282">
  <style>
    .box { fill:#fff; stroke:#222; stroke-width:2; rx:8; ry:8 }
    .label { font-family:'Comic Sans MS', cursive; font-weight:700; font-size:12 }
    .muted { font-family:'Comic Sans MS', cursive; font-size:11; fill:#333 }
    .arrow { stroke:#1f618d; stroke-width:2.5; fill:none; marker-end:url(#a) }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0,8 4,0 8" fill="#1f618d"/></marker>
  </defs>
  <rect width="282" height="282" fill="#fff"/>

  <g transform="translate(30,30)">
    <rect class="box" width="100" height="40" />
    <text x="50" y="26" text-anchor="middle" class="label">Predict</text>
  </g>
  <g transform="translate(150,30)">
    <rect class="box" width="100" height="40" />
    <text x="50" y="26" text-anchor="middle" class="label">Update</text>
  </g>
  <path class="arrow" d="M130 50 L150 50" />
  <path class="arrow" d="M100 70 L100 120 L180 120" />

  <text x="141" y="210" class="muted" text-anchor="middle">Recursive predict-update cycle combining model and measurements</text>
</svg>
